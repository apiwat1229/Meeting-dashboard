name: it-dashboard-dev

services:
  app:
    build:
      context: .
      target: development
    command: sh -c "npm run db:setup && npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dashboard:dashboard_dev_only@db:5432/it_dashboard_dev
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: it_dashboard_dev
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_dev_only
    volumes:
      - dashboard_dev_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d it_dashboard_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  app_node_modules:
  app_next_cache:
  dashboard_dev_data:
